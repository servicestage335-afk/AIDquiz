{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Académie AID - 2026-2027</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 text-gray-800 min-h-screen flex flex-col">
    <nav class="bg-white/60 backdrop-blur-md shadow-sm border-b border-white/40">
        <div class="container mx-auto px-4 py-4 flex justify-center items-center">
            <a href="https://aid-academy.com/" target="_blank">
                <img src="{% static 'logo1.png' %}" alt="Logo AID" class="h-12 w-auto">
            </a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800/80 backdrop-blur-sm text-white text-center py-4 mt-auto">
        <p>&copy; 2023 Plateforme Centrale. Tous droits réservés.</p>
    </footer>
</body>
</html>
